# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Use default prompt format
format = '$all'

# Inserts a blank line between shell prompts
add_newline = false

[aws]
symbol = ""

[battery]
disabled = true

[directory]
# style = "blue"
truncation_length = 3
# truncation_symbol = "../"
